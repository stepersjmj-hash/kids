<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리집 재생목록</title>
<link rel="icon" href="ic_launcher.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 디자인 토큰 (design_handoff_kids_1b "아이 손") */
  :root {
    --bg:#fbf3e4; --panel:#fffaf1; --card:#ffffff; --line:#efe2c8; --line2:#e6d9c0; --text:#2b2118; --sub:#a1866a; --sub2:#b59c7c; --grip:#cbb594;
    --accent:#ff5c5c; --accent-dark:#d94545; --accent-top:#ff7272; --ok:#3ddc84; --ok-ink:#0f2a1a; --ok-text:#1f8f50; --focus:#ffd54a; --current:#ffe9a8;
    --danger:#c23b3b; --btn-depth:#ead9bb; --video:#2a3140;
    --jua:Jua, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; --gowun:"Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; --num:Pretendard, system-ui, sans-serif;
    /* TV 화면 단위: 시안 기준 960×540 CSS px. 1u = 1px@540 → WebView 해상도가 달라도 비율 유지 */
    --u:calc(100vh / 540);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--gowun); }
  body { display:grid; grid-template-columns:minmax(0,1fr) 380px; grid-template-rows:100vh; grid-template-rows:100dvh; }
  body.tv { grid-template-columns:minmax(0,1fr); }
  body.tv #side { display:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; }
  button svg, .chip svg { display:block; flex:none; }
  .ph { display:none; }

  /* ---------- 무대 (영상 + 조작) ---------- */
  #stage { min-width:0; min-height:0; position:relative; display:flex; flex-direction:column; align-items:center; padding:24px 40px 28px; overflow:auto; }
  #logo { width:100%; height:32px; display:flex; align-items:center; gap:8px; color:var(--sub); flex:none; }
  #logo img { width:24px; height:24px; border-radius:7px; display:block; flex:none; }
  #logo span { font:400 15px/24px var(--jua); padding-top:2px; }
  #logo br { display:none; }
  #pickHint { display:none; }
  #frame { position:relative; width:min(980px, 100%, calc((100dvh - 330px) * 16 / 9)); aspect-ratio:16/9; border:10px solid #fff; border-radius:34px; background:var(--video); box-shadow:0 14px 30px rgba(120,80,30,.16); margin-top:16px; flex:none; overflow:hidden; }
  #player-wrap { position:relative; width:100%; height:100%; overflow:hidden; border-radius:24px; background:var(--video); }
  /* 플레이어 두 개(A/B)를 겹쳐 두고 하나만 보임. 대기(standby) 쪽은 다음 영상을 미리 불러 둔다 — visibility 로 숨겨야 재생이 멈추지 않음 */
  #player-wrap .yt { position:absolute; inset:0; }
  /* 유튜브가 마우스 올림·일시정지 때 띄우는 제목 줄(위)·로고(아래)를 가리려고 iframe 을 위아래로 --crop 만큼 키워 틀 밖으로 밀어낸다.
     영상은 16:9 로 가운데 맞춰지고 남는 위아래는 검정이라 그림은 잘리지 않음 */
  #player-wrap { --crop:72px; }
  #player-wrap .yt iframe { position:absolute; left:0; top:calc(-1 * var(--crop)); width:100%; height:calc(100% + 2 * var(--crop)); display:block; }
  #player-wrap .yt.standby { visibility:hidden; pointer-events:none; }
  /* 끝화면/추천 가리기용 덮개: 재생 중엔 투명, 전환 중엔 불투명 */
  #cover { position:absolute; inset:0; background:var(--video); display:flex; align-items:center; justify-content:center; color:#aab3c4; font:400 20px/1.4 var(--jua); padding:0 24px; text-align:center; transition:opacity .25s; pointer-events:none; overflow:hidden; }
  #cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  #cover.paused img { display:block; }
  #cover.paused span { position:relative; background:rgba(43,33,24,.7); color:#fff; padding:8px 16px; border-radius:999px; font-size:16px; }
  #cover.hidden { opacity:0; }
  #titleRow2 { width:min(980px, 100%); display:flex; align-items:center; gap:16px; margin-top:20px; flex:none; }
  #nowTitle { flex:1; min-width:0; font:400 26px/32px var(--jua); padding-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #dots { display:flex; gap:6px; align-items:center; flex:none; max-width:45%; overflow:hidden; }
  #dots i { width:10px; height:10px; border-radius:5px; background:var(--line2); flex:none; }
  #dots i.seen { background:var(--ok); }
  #dots i.now { width:28px; background:var(--accent); }
  #dots b { font:400 13px/1 var(--num); color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #prog { width:min(980px, 100%); display:flex; align-items:center; gap:14px; margin-top:14px; flex:none; }
  #prog time { font:400 13px/1 var(--num); color:var(--sub); font-variant-numeric:tabular-nums; min-width:3ch; }
  #prog time:last-child { text-align:right; }
  #prog .track { flex:1; height:10px; border-radius:5px; background:var(--line); position:relative; cursor:pointer; touch-action:none; }
  #prog .track::before { content:''; position:absolute; left:0; right:0; top:-12px; bottom:-12px; }   /* 누르기 쉬운 넓은 영역 */
  #prog .fill { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:5px; background:var(--accent); }
  #prog .knob { position:absolute; left:0; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:10px; background:#fff; box-shadow:0 0 0 4px var(--accent); }
  #bar { width:min(980px, 100%); display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; margin-top:22px; flex:none; }
  #bar .l, #bar .r { display:flex; gap:8px; align-items:center; min-width:0; }
  #bar .r { justify-content:flex-end; }
  #bar .m { display:flex; align-items:center; gap:20px; }
  /* 알약 칩 */
  .chip { height:40px; display:inline-flex; align-items:center; gap:6px; padding:0 16px; border-radius:999px; background:var(--card); color:var(--text); white-space:nowrap; }
  .chip:hover { background:#fff3dc; }
  .chip span { font:400 15px/24px var(--jua); padding-top:2px; }
  .chip svg { width:16px; height:16px; }
  .chip .ck { display:none; }
  .chip.on { background:var(--ok); color:var(--ok-ink); padding-left:12px; }
  .chip.on:hover { background:#4fe693; }
  .chip.on .ck { display:block; }
  .chip.ico { padding-left:12px; }
  /* PC 전체화면·새로고침은 아이콘만 (40px 원) */
  #btnFull, #btnReload { width:40px; padding:0; justify-content:center; }
  #btnFull span, #btnReload span { display:none; }
  #btnFull svg, #btnReload svg { width:18px; height:18px; }
  /* 둥근 버튼: 이전 · 재생 · 다음 (두께 그림자는 꼭 inset) */
  .rb { width:52px; height:52px; border-radius:50%; background:linear-gradient(#fff,#fff8ec); box-shadow:inset 0 -5px 0 var(--btn-depth), 0 6px 14px rgba(120,80,30,.12); display:flex; align-items:center; justify-content:center; color:var(--text); padding-bottom:4px; flex:none; }
  .rb svg { width:22px; height:22px; }
  #btnPrev svg { margin-left:-2px; }
  #btnNext svg { margin-right:-2px; }
  #btnPlay { width:68px; height:68px; background:linear-gradient(var(--accent-top), var(--accent)); box-shadow:inset 0 2px 0 rgba(255,255,255,.35), inset 0 -5px 0 var(--accent-dark), 0 8px 18px rgba(217,69,69,.25); color:#fff; padding-bottom:0; }
  #btnPlay svg { width:30px; height:30px; }
  #btnPlay .pause { margin-top:-3px; }
  #btnPlay .play { transform:translateX(1.5px); }
  #btnPlay.playing .play, #btnPlay:not(.playing) .pause { display:none; }
  #btnShuffle { display:none; }   /* 셔플은 UI 에서 뺌(설정은 항상 꺼짐) */
  .thumbNav { display:none; }

  /* ---------- TV 앱 재생 화면 (body.app, 960×540 기준 → u 단위). 영상 틀을 최대한 크게, 나머지는 작게 ---------- */
  body.app #stage { padding:calc(14 * var(--u)) 0 0; overflow:hidden; }
  body.app #logo { position:absolute; left:calc(24 * var(--u)); top:calc(16 * var(--u)); width:auto; height:auto; gap:calc(8 * var(--u)); }
  body.app #logo img { width:calc(28 * var(--u)); height:calc(28 * var(--u)); border-radius:calc(8 * var(--u)); }
  body.app #logo span { font-size:calc(14 * var(--u)); line-height:calc(17 * var(--u)); padding-top:calc(2 * var(--u)); }
  body.app #logo br { display:inline; }
  body.app #pickHint { display:flex; position:absolute; right:calc(24 * var(--u)); top:calc(16 * var(--u)); height:calc(32 * var(--u)); align-items:center; gap:calc(4 * var(--u)); padding:0 calc(12 * var(--u)) 0 calc(8 * var(--u)); border-radius:999px; background:#fff; color:var(--sub); }
  body.app #pickHint svg { width:calc(16 * var(--u)); height:calc(16 * var(--u)); display:block; }
  body.app #pickHint span { font:400 calc(14 * var(--u)) / calc(24 * var(--u)) var(--jua); padding-top:calc(2 * var(--u)); }
  body.app #frame { width:calc(692 * var(--u)); height:calc(398 * var(--u)); aspect-ratio:auto; margin-top:0; border-width:calc(10 * var(--u)); border-radius:calc(30 * var(--u)); box-shadow:0 calc(14 * var(--u)) calc(30 * var(--u)) rgba(120,80,30,.16); }
  body.app #player-wrap { border-radius:calc(20 * var(--u)); }
  body.app #cover { font-size:calc(20 * var(--u)); }
  body.app #titleRow2 { width:calc(692 * var(--u)); margin-top:calc(10 * var(--u)); gap:calc(16 * var(--u)); }
  body.app #nowTitle { font-size:calc(17 * var(--u)); line-height:calc(22 * var(--u)); padding-top:calc(2 * var(--u)); }
  body.app #dots { gap:calc(6 * var(--u)); }
  body.app #dots i { width:calc(8 * var(--u)); height:calc(8 * var(--u)); border-radius:calc(4 * var(--u)); }
  body.app #dots i.now { width:calc(22 * var(--u)); }
  body.app #dots b { font-size:calc(12 * var(--u)); }
  body.app #prog { width:calc(692 * var(--u)); margin-top:calc(8 * var(--u)); gap:0; }
  body.app #prog time { display:none; }
  body.app #prog .track { height:calc(6 * var(--u)); border-radius:calc(3 * var(--u)); }
  body.app #prog .fill { border-radius:calc(3 * var(--u)); }
  body.app #prog .knob { width:calc(14 * var(--u)); height:calc(14 * var(--u)); margin:calc(-7 * var(--u)) 0 0 calc(-7 * var(--u)); box-shadow:0 0 0 calc(3 * var(--u)) var(--accent); }
  body.app #bar { width:calc(692 * var(--u)); margin-top:calc(14 * var(--u)); }
  body.app #bar .chip { display:none; }
  body.app #bar .m { gap:calc(22 * var(--u)); }
  body.app .thumbNav { display:flex; align-items:center; gap:calc(8 * var(--u)); min-width:0; }
  body.app #prevThumb { opacity:.75; }
  body.app #nextThumb { justify-content:flex-end; }
  body.app .thumbNav img { width:calc(72 * var(--u)); height:calc(40 * var(--u)); border-radius:calc(10 * var(--u)); border:calc(3 * var(--u)) solid #fff; object-fit:cover; background:var(--video); display:block; flex:none; }
  body.app #nextThumb img { box-shadow:0 calc(2 * var(--u)) 0 var(--btn-depth); }
  body.app .thumbNav span { font:400 calc(14 * var(--u)) / calc(20 * var(--u)) var(--jua); padding-top:calc(2 * var(--u)); color:var(--sub); white-space:nowrap; }
  body.app #nextThumb span { color:var(--text); }
  body.app .thumbNav.empty { visibility:hidden; }
  body.app .rb { width:calc(40 * var(--u)); height:calc(40 * var(--u)); padding-bottom:calc(3 * var(--u)); box-shadow:inset 0 calc(-4 * var(--u)) 0 var(--btn-depth), 0 calc(4 * var(--u)) calc(10 * var(--u)) rgba(120,80,30,.12); }
  body.app .rb svg { width:calc(18 * var(--u)); height:calc(18 * var(--u)); }
  body.app #btnPrev svg { margin-left:calc(-1 * var(--u)); }
  body.app #btnNext svg { margin-right:calc(-1 * var(--u)); }
  body.app #btnPlay { width:calc(50 * var(--u)); height:calc(50 * var(--u)); padding-bottom:0; box-shadow:inset 0 calc(2 * var(--u)) 0 rgba(255,255,255,.35), inset 0 calc(-4 * var(--u)) 0 var(--accent-dark); }
  body.app #btnPlay svg { width:calc(23 * var(--u)); height:calc(23 * var(--u)); }
  body.app #btnPlay .pause { margin-top:calc(-2 * var(--u)); }
  /* 전체화면: 오른쪽 아래 흰 원 버튼 (#bar 안의 네 번째 버튼 → ←/→ 링 순서는 이전·재생·다음·전체화면) */
  body.app #bar #btnFull { display:flex; position:absolute; right:calc(24 * var(--u)); bottom:calc(20 * var(--u)); width:calc(40 * var(--u)); height:calc(40 * var(--u)); padding:0 0 calc(3 * var(--u)); border-radius:50%; background:linear-gradient(#fff,#fff8ec); box-shadow:inset 0 calc(-4 * var(--u)) 0 var(--btn-depth), 0 calc(4 * var(--u)) calc(10 * var(--u)) rgba(120,80,30,.12); align-items:center; justify-content:center; color:var(--text); }
  body.app #btnFull svg { width:calc(18 * var(--u)); height:calc(18 * var(--u)); }
  body.app #btnFull span { display:none; }
  /* 리모컨 포커스 링 — transition 없음 (TV WebView 성능) */
  body.app .rb.kfocus, body.app #bar #btnFull.kfocus { box-shadow:inset 0 calc(-4 * var(--u)) 0 var(--btn-depth), 0 calc(4 * var(--u)) calc(10 * var(--u)) rgba(120,80,30,.12), 0 0 0 calc(4 * var(--u)) var(--bg), 0 0 0 calc(8 * var(--u)) var(--focus); }
  body.app #btnPlay.kfocus { box-shadow:inset 0 calc(2 * var(--u)) 0 rgba(255,255,255,.35), inset 0 calc(-4 * var(--u)) 0 var(--accent-dark), 0 0 0 calc(4 * var(--u)) var(--bg), 0 0 0 calc(8 * var(--u)) var(--focus); }
  body.app #btnImportYt, body.app #bookmarkHint, body.app #btnTv { display:none; }
  /* ?app=1 흉내 모드: 창 비율과 상관없이 TV 와 같은 16:9(960×540u) 상자를 가운데 두고 그 안에 그린다 */
  html.sim { --u:min(calc(100vw / 960), calc(100vh / 540)); }
  html.sim body { display:flex; align-items:center; justify-content:center; background:#111; }
  html.sim body.app #stage { width:calc(960 * var(--u)); height:calc(540 * var(--u)); flex:none; background:var(--bg); }
  html.sim #tvList { inset:auto; left:50%; top:50%; transform:translate(-50%, -50%); width:calc(960 * var(--u)); height:calc(540 * var(--u)); }
  html.sim body.app #toast { right:calc(50vw - 480 * var(--u) + 24 * var(--u)); bottom:calc(50vh - 270 * var(--u) + 14 * var(--u)); }
  /* TV 앱 전체화면: 영상 틀만 화면 가득 */
  body.full #frame { position:fixed; inset:0; width:auto !important; height:auto !important; aspect-ratio:auto; border:0; border-radius:0; box-shadow:none; margin:0; z-index:5; }
  body.full #player-wrap { border-radius:0; }
  body.full #stage > :not(#frame) { display:none; }
  body.full #side { display:none; }
  /* PC·폰 CSS 전체화면의 나가기 버튼 (TV 앱은 뒤로 키) */
  #fsExit { display:none; position:absolute; top:12px; right:12px; z-index:3; width:40px; height:40px; border-radius:50%; background:rgba(43,33,24,.6); color:#fff; align-items:center; justify-content:center; }
  #fsExit svg { width:18px; height:18px; }
  body.full:not(.app) #fsExit { display:flex; }
  /* 브라우저 요소 전체화면(#frame.requestFullscreen) */
  #frame:fullscreen { width:100%; height:100%; aspect-ratio:auto; border:0; border-radius:0; box-shadow:none; background:#000; }
  #frame:fullscreen #player-wrap { border-radius:0; }
  #frame:-webkit-full-screen { width:100%; height:100%; aspect-ratio:auto; border:0; border-radius:0; box-shadow:none; background:#000; }
  #frame:-webkit-full-screen #player-wrap { border-radius:0; }

  /* ---------- 사이드 (PC 목록) ---------- */
  #side { background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #side header { padding:24px 22px 16px; display:flex; flex-direction:column; gap:14px; border-bottom:1px solid var(--line); flex:none; }
  #titleRow { display:flex; flex-wrap:wrap; align-items:center; gap:14px 8px; }
  #side h1 { flex:1; min-width:0; margin:0; font:400 24px/30px var(--jua); padding-top:3px; white-space:nowrap; }
  #btnGoogle { height:34px; display:inline-flex; align-items:center; gap:7px; padding:0 12px; border-radius:999px; background:#fff; border:1px solid var(--line2); color:#1f1f1f; font:600 13px/1 var(--num); flex:none; }
  #btnGoogle:hover { background:#f1f3f4; }
  #btnGoogle svg { width:16px; height:16px; }
  #gAvatar { width:20px; height:20px; border-radius:50%; object-fit:cover; }
  #btnGoogle.in svg { display:none; }
  #syncStatus { order:3; flex-basis:100%; display:flex; align-items:center; gap:6px; color:var(--sub); font:400 12px/18px var(--gowun); min-width:0; }
  #syncStatus i { width:8px; height:8px; border-radius:4px; background:var(--line2); flex:none; }
  #syncStatus.on i { background:var(--ok); }
  #syncStatus.warn i { background:#f5b84a; }
  #syncStatus span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #syncStatus b { display:none; font-weight:400; }
  /* 붙여넣기 카드 */
  #add { display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:20px; background:var(--accent); }
  #add label { font:400 16px/22px var(--jua); padding-top:2px; color:#fff; }
  #add .row { display:flex; gap:8px; }
  #add input { flex:1; min-width:0; height:44px; background:#fff; border:0; border-radius:12px; padding:0 12px; font:400 14px/1 var(--gowun); color:var(--text); }
  #add input::placeholder { color:var(--sub); }
  #btnAdd { height:44px; padding:2px 18px 0; border-radius:12px; background:var(--text); color:#fff; font:400 16px/22px var(--jua); flex:none; }
  #btnTools { display:none; }
  #tools { display:flex; flex-wrap:wrap; gap:6px; }
  #tools button { height:30px; display:inline-flex; align-items:center; padding:0 12px; border-radius:999px; background:#fff; border:1px solid var(--line); font:400 12px/1 var(--gowun); }
  #tools button:hover { background:#fff3dc; }
  #tools #btnClear { color:var(--danger); border-color:#f3c9c3; }
  #tools #btnClear:hover { background:#fff0ee; }
  #link { font:400 12px/18px var(--gowun); color:var(--sub); display:flex; gap:6px; align-items:center; }
  #link.on { color:var(--ok-text); }
  #link span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #link button { height:24px; padding:0 10px; border-radius:999px; background:#fff; border:1px solid var(--line); font:400 12px/1 var(--gowun); color:var(--text); flex:none; }
  /* 목록 행 */
  #list { flex:1; min-height:0; overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .item { display:flex; align-items:center; gap:10px; padding:7px 7px 7px 4px; border-radius:16px; background:var(--card); cursor:grab; user-select:none; -webkit-user-select:none; flex:none; position:relative; transition:transform .15s; }
  .item.current { background:var(--current); }
  .item.bad { opacity:.55; }
  .item.dragging { opacity:.4; transition:none; z-index:2; }
  .item.swiping { transition:none; }
  .item.drop-after { box-shadow:0 3px 0 var(--accent); }
  .item.drop-before { box-shadow:0 -3px 0 var(--accent); }
  .item .grip { width:14px; height:24px; display:grid; grid-template-columns:repeat(2,4px); grid-auto-rows:4px; gap:3px; align-content:center; justify-content:center; flex:none; opacity:.7; touch-action:none; }
  .item .grip i { border-radius:2px; background:var(--grip); }
  .item .n { width:28px; height:28px; border-radius:14px; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; font:400 14px/1 var(--jua); padding-top:2px; flex:none; }
  .item.current .n { background:var(--accent); color:#fff; }
  .item img { width:68px; height:40px; border-radius:10px; object-fit:cover; background:var(--video); flex:none; }
  .item .t { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .item .t em { font:400 13px/1.35 var(--gowun); font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .t small { font:400 11px/1 var(--gowun); color:var(--sub2); }
  .item.current .t small, .item.bad .t small { color:var(--danger); }
  .item .del { width:24px; height:24px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--sub2); flex:none; }

  /* Google 가져오기 모달 */

  #confirm[hidden] { display:none; }
  #confirm .box { background:var(--panel); border-radius:20px; width:min(360px, 100%); padding:22px 20px 18px; display:flex; flex-direction:column; gap:10px; box-shadow:0 20px 50px rgba(60,40,10,.2); }
  #confirm b { font:400 20px/26px var(--jua); padding-top:2px; }
  #confirm p { margin:0; font:400 14px/1.4 var(--gowun); color:var(--sub); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  #confirm .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  #confirm .btns button { height:40px; padding:2px 18px 0; border-radius:999px; font:400 15px/24px var(--jua); }
  #confirmNo { background:#fff; border:1px solid var(--line2); color:var(--text); }
  #confirmYes { background:var(--accent); color:#fff; box-shadow:inset 0 -3px 0 var(--accent-dark); }
  .item .swipeBg { display:none; }
  #gModal .box { background:var(--panel); border-radius:20px; width:min(560px, 92vw); max-height:80vh; display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(60,40,10,.2); }
  #gModal .head { display:flex; align-items:center; padding:16px 18px; border-bottom:1px solid var(--line); }
  #gModal .head b { flex:1; font:400 18px/24px var(--jua); padding-top:2px; }
  #gModal .head button, .src button { height:30px; padding:0 12px; border-radius:999px; background:#fff; border:1px solid var(--line); font:400 12px/1 var(--gowun); white-space:nowrap; }
  .src button:hover, #gModal .head button:hover { background:#fff3dc; }
  #gList { overflow:auto; padding:8px; }
  .src { display:flex; gap:6px; align-items:center; padding:8px 10px; border-radius:12px; }
  .src:hover { background:#fff3dc; }
  .src .n { flex:1; font-size:14px; }
  .src .n small { display:block; color:var(--sub); font-size:11px; margin-top:2px; }

  /* ---------- TV 골라 보기 (↓) ---------- */
  #tvList { position:fixed; inset:0; background:var(--bg); z-index:20; display:flex; flex-direction:column; gap:calc(22 * var(--u)); padding:calc(32 * var(--u)) calc(40 * var(--u)); }
  #tvList[hidden] { display:none; }
  #tvHead { display:flex; align-items:center; gap:calc(10 * var(--u)); flex:none; }
  #tvHead h2 { flex:1; min-width:0; margin:0; font:400 calc(36 * var(--u)) / calc(40 * var(--u)) var(--jua); padding-top:calc(4 * var(--u)); white-space:nowrap; }
  #tvChips { display:flex; gap:calc(10 * var(--u)); flex:none; }
  #tvChips .chip { height:calc(40 * var(--u)); padding:0 calc(16 * var(--u)); gap:calc(6 * var(--u)); }
  #tvChips .chip.on { padding-left:calc(12 * var(--u)); }
  #tvChips .chip span { font-size:calc(16 * var(--u)); line-height:calc(24 * var(--u)); padding-top:calc(2 * var(--u)); }
  #tvChips .chip svg { width:calc(16 * var(--u)); height:calc(16 * var(--u)); }
  #tvChips .chip.sel { box-shadow:0 0 0 calc(3 * var(--u)) var(--bg), 0 0 0 calc(7 * var(--u)) var(--focus); }
  #tvChips .chip img { width:calc(26 * var(--u)); height:calc(26 * var(--u)); border-radius:50%; object-fit:cover; display:block; flex:none; margin-left:calc(-6 * var(--u)); }
  #tvItems { flex:1; min-height:0; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); grid-auto-rows:max-content; gap:calc(24 * var(--u)) calc(28 * var(--u)); align-content:start; padding:calc(10 * var(--u)) 0 0 calc(10 * var(--u)); }
  .tvi { display:flex; flex-direction:column; gap:calc(10 * var(--u)); min-width:0; transition:transform .15s; cursor:pointer; }
  .tvi .th { height:calc(136 * var(--u)); border-radius:calc(24 * var(--u)); border:calc(6 * var(--u)) solid #fff; background:var(--video); box-shadow:0 calc(3 * var(--u)) 0 var(--btn-depth); position:relative; transition:box-shadow .15s; }
  .tvi .th img { width:100%; height:100%; object-fit:cover; border-radius:calc(18 * var(--u)); display:block; }
  .tvi .n { position:absolute; left:calc(-10 * var(--u) - 6 * var(--u)); top:calc(-10 * var(--u) - 6 * var(--u)); width:calc(40 * var(--u)); height:calc(40 * var(--u)); border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font:400 calc(20 * var(--u)) / 1 var(--jua); padding-top:calc(3 * var(--u)); box-shadow:0 0 0 calc(4 * var(--u)) var(--bg); }
  .tvi span { font:400 calc(19 * var(--u)) / 1.2 var(--jua); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 calc(4 * var(--u)); }
  .tvi.sel { transform:translateY(calc(-6 * var(--u))); }
  .tvi.sel .th { border-color:var(--focus); box-shadow:0 calc(12 * var(--u)) calc(24 * var(--u)) rgba(120,80,30,.22); }
  .tvi.bad { opacity:.55; }
  .tvEmpty { grid-column:1 / -1; font:400 calc(22 * var(--u)) / 1.4 var(--jua); color:var(--sub); padding:calc(20 * var(--u)) 0; }
  #tvPages { display:flex; justify-content:center; gap:calc(8 * var(--u)); flex:none; min-height:calc(10 * var(--u)); }
  #tvPages i { width:calc(10 * var(--u)); height:calc(10 * var(--u)); border-radius:calc(5 * var(--u)); background:var(--line2); }
  #tvPages i.now { width:calc(28 * var(--u)); background:var(--text); }

  #toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 16px; border-radius:999px; font:400 13px/1.3 var(--gowun); opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; max-width:90vw; text-align:center; }
  #toast.show { opacity:1; }
  body.app #toast { left:auto; right:calc(24 * var(--u)); bottom:calc(14 * var(--u)); transform:none; font-size:calc(14 * var(--u)); padding:calc(10 * var(--u)) calc(16 * var(--u)); max-width:calc(300 * var(--u)); }   /* TV: 조작 버튼을 가리지 않게 오른쪽 아래 */

  /* ---------- 폰 (≤820px): 세로로 한 줄 ---------- */
  @media (max-width: 820px) {
    body { display:flex; flex-direction:column; }
    .pc { display:none; }
    .ph { display:inline; }
    #stage { flex:none; padding:16px 16px 0; overflow:visible; }
    #logo, #titleRow2 { display:none; }
    #prog { margin-top:12px; gap:10px; }
    #bar { margin-top:10px; }
    #bar .l .chip, #bar #btnTv { display:none; }   /* .l 은 빈 칸으로 남겨 세 버튼이 가운데 오게 */
    #bar .r { justify-content:flex-end; }
    #btnFull, #btnReload { width:34px; height:34px; padding:0 0 3px; border-radius:50%; background:linear-gradient(#fff,#fff8ec); box-shadow:inset 0 -4px 0 var(--btn-depth), 0 4px 10px rgba(120,80,30,.12); justify-content:center; }
    #btnFull span, #btnReload span { display:none; }
    #btnFull svg, #btnReload svg { width:15px; height:15px; }
    #bar .m { gap:18px; }
    .rb { width:36px; height:36px; padding-bottom:3px; box-shadow:inset 0 -4px 0 var(--btn-depth), 0 4px 10px rgba(120,80,30,.12); } .rb svg { width:16px; height:16px; }
    #btnPlay { width:46px; height:46px; padding-bottom:0; box-shadow:inset 0 2px 0 rgba(255,255,255,.35), inset 0 -4px 0 var(--accent-dark); } #btnPlay svg { width:21px; height:21px; }
    #frame { width:100%; max-width:none; border-width:8px; border-radius:22px; margin-top:0; }
    #player-wrap { border-radius:14px; }
    #side, body.tv #side { display:flex; flex:1; min-height:0; border-left:0; padding-bottom:env(safe-area-inset-bottom); overflow-y:auto; overflow-x:hidden; }   /* 폰은 TV 모드여도 목록을 보여 준다. 머리(제목·카드)와 목록이 함께 스크롤 */
    #side header { padding:18px 20px 12px; border-bottom:0; }
    #titleRow { flex-wrap:nowrap; }
    #side h1 { font:400 26px/32px var(--jua); padding-top:3px; white-space:normal; }
    #syncStatus { order:0; flex-basis:auto; height:30px; padding:0 12px 0 10px; border-radius:999px; background:#fff; font:400 13px/18px var(--gowun); }
    #syncStatus.on { color:var(--ok-text); }
    #syncStatus span { display:none; }
    #syncStatus b { display:inline; }
    #btnGoogle { width:34px; padding:0; justify-content:center; }
    #gLabel { display:none; }
    #add label { font-size:17px; }
    #btnTools { display:inline-flex; align-self:flex-start; height:30px; align-items:center; padding:0 12px; border-radius:999px; background:#fff; border:1px solid var(--line); font:400 12px/1 var(--gowun); margin-top:-4px; }
    #tools, #link { display:none; }
    body.tools-open #tools, body.tools-open #link { display:flex; }
    #list { padding:2px 20px 20px; gap:10px; flex:none; overflow:visible; }   /* 스크롤은 #side 가 담당 */
    /* 왼쪽으로 밀면 행 오른쪽 바깥에 붙은 빨간 배경이 드러난다. 80px 넘으면 '놓으면 삭제' */
    .item.swiping .swipeBg { display:flex; position:absolute; left:100%; top:0; bottom:0; width:240px; margin-left:-18px; padding-left:34px; border-radius:0 18px 18px 0; background:var(--accent); color:#fff; align-items:center; gap:6px; font:400 15px/24px var(--jua); z-index:-1; }
    .item.swiping { z-index:0; }
    .item .swipeBg svg { width:18px; height:18px; display:block; transition:transform .15s; }
    .item.willDelete .swipeBg { background:var(--danger); }
    .item.willDelete .swipeBg svg { transform:scale(1.3); }
    .item { gap:12px; padding:8px; border-radius:18px; cursor:default; touch-action:pan-y; }
    .item .grip { order:9; width:24px; height:24px; display:flex; flex-direction:column; justify-content:center; gap:4px; padding:0 4px; }
    .item .grip i { height:2.5px; }
    .item .grip i:nth-child(n+4) { display:none; }
    .item .n { width:30px; height:30px; border-radius:15px; font-size:15px; }
    .item img { width:72px; height:44px; border-radius:12px; }
    .item .t em { font-size:14px; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .item .t small { display:none; }
    .item .del { display:none; }
    #hint { display:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="logo"><img src="ic_launcher.png" alt=""><span>우리집 <br>재생목록</span></div>
  <div id="pickHint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg><span>골라 보기</span></div>

      <button id="btnShuffle" class="chip" title="셔플 (S)"><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>섞어서</span></button>
      <div id="prevThumb" class="thumbNav empty"><img alt=""><span>이전</span></div>

      <button id="btnPlay" class="rb" title="재생/일시정지 (Space)"><svg class="play" viewBox="0 0 24 24"><path d="M7 5.6v12.8c0 1.2 1.3 1.9 2.3 1.2l9.4-6.4a1.5 1.5 0 0 0 0-2.4L9.3 4.4C8.3 3.7 7 4.4 7 5.6z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg><svg class="pause" viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="4.6" height="15" rx="2.3" fill="currentColor"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="2.3" fill="currentColor"/></svg></button>

  <header>

      <div id="syncStatus"><i></i><span id="syncText">로그인하면 구글 드라이브로 폰·TV와 목록이 맞춰집니다</span><b id="syncShort">로그인 안 함</b></div>
      <button id="btnGoogle" title="로그인: 드라이브 동기화 + 좋아요·재생목록 가져오기"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg><img id="gAvatar" alt="" hidden referrerpolicy="no-referrer"><span id="gLabel">Google 로그인</span></button>

<script>
/* ---------- 설정 ---------- */
// TV 앱(android-tv/) 안에서 열렸는지 — 앱이 addJavascriptInterface 로 KidsTV 를 넣어 준다

/* ---------- 저장/불러오기 ---------- */
function save(){
  localStorage.setItem(KEY, JSON.stringify(items)); localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  // 영상 구성/순서가 바뀐 경우에만 드라이브 동기화 (제목 채우기·설정 변경은 제외)
  const sig = items.map(x => x.id).join(',');
  if (sig !== save._sig) { save._sig = sig; scheduleDriveSync(); }
}
function load(){
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch { items = []; }
  try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}); } catch {}
}
async function loadRemote(url){
  try {
    const r = await fetch(url, {cache:'no-store'});
    const data = await r.json();
    const arr = Array.isArray(data) ? data : (data.items || []);
    items = arr.map(x => typeof x === 'string' ? {id:extractId(x), title:''} : {id:x.id||extractId(x.url||''), title:x.title||''}).filter(x=>x.id);
    save(); rebuildOrder(); render(); toast(`원격 목록 ${items.length}개 불러옴`);
    fillTitles();
  } catch(e){ toast('원격 목록을 읽지 못했습니다'); console.error(e); }
}

/* ---------- URL → ID ---------- */
function extractId(s){
  s = (s||'').trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:v=|\/shorts\/|youtu\.be\/|\/embed\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}

/* ---------- 유튜브 재생목록 연결 ---------- */
// 재생목록 URL(list=...)이고 특정 영상(v=)이 아니면 재생목록 ID 반환
function extractPlaylistId(s){
  s = (s||'').trim();
  const m = s.match(/[?&]list=([\w-]+)/);
  if (m && !/[?&]v=/.test(s)) return m[1];
  if (/^(PL|UU|FL|OL)[\w-]{10,}$/.test(s)) return s;
  return null;
}
// 숨긴 보조 플레이어로 재생목록을 불러와 영상 ID 목록을 얻는다 (API 키 불필요)
// 기존 플레이어에 cuePlaylist 를 다시 부르면 목록이 안 바뀌므로 매번 새로 만든다
function fetchPlaylistIds(pl){
  return new Promise((resolve, reject) => {
    $('#plLoader').innerHTML = '<div id="plLoaderPlayer"></div>';
    let loader = null, done = false;
    const finish = (fn, v) => { if (done) return; done = true; clearInterval(poll); clearTimeout(to); try { loader.destroy(); } catch {} fn(v); };
    const poll = setInterval(() => { const ids = loader && loader.getPlaylist && loader.getPlaylist(); if (ids && ids.length) finish(resolve, ids); }, 500);
    const to = setTimeout(() => finish(reject, new Error('timeout')), 15000);
    loader = new YT.Player('plLoaderPlayer', {
      width: 320, height: 180,
      // 첫 영상이 임베드 금지여도 목록은 받을 수 있으니 onError 로 실패 처리하지 않고 타임아웃에 맡긴다
      playerVars: { listType: 'playlist', list: pl, autoplay: 0, mute: 1 }
    });
  });
}
async function syncPlaylist(){
  if (!settings.pl) return;
  if (!ytReady) { pendingSync = true; return; }
  syncing = true; render();
  try {
    const ids = await fetchPlaylistIds(settings.pl);
    const old = new Map(items.map(x => [x.id, x]));
    const curId = idx >= 0 && items[idx] ? items[idx].id : null;
    items = [...new Set(ids)].map(id => old.get(id) || { id, title: '' });
    idx = curId ? items.findIndex(x => x.id === curId) : -1;
    save(); rebuildOrder(); render(); fillTitles();
    toast(`재생목록 동기화: ${items.length}개`);
  } catch (e) {
    toast('재생목록을 불러오지 못했습니다 (비공개이거나 잘못된 ID)'); console.error(e);
  }
  syncing = false; render();
}
function linkPlaylist(pl){
  settings.pl = pl; save(); render(); syncPlaylist();
}

/* ---------- Google 로그인으로 가져오기 (좋아요·내 재생목록) ---------- */
// 토큰은 만료 시각(약 1시간)까지만 localStorage 에 둔다 — 새 탭(?add=)에서도 바로 동기화되도록.
// 권한은 youtube.readonly + drive.file(이 앱이 만든 파일만) + drive.appdata(예전 저장 위치 이전용)
const TOKEN_KEY = 'home-playlist-gtoken';
let gToken = null, gTokenExp = 0, gClient = null;
// 유튜브 가져오기용 토큰은 따로 (youtube.readonly 와 drive.file 은 한 요청에 같이 못 넣음: invalid_request)
let ytToken = null, ytTokenExp = 0, ytClient = null;
function restoreToken(){
  try {
    const o = JSON.parse(localStorage.getItem(TOKEN_KEY));
    if (o && o.exp > Date.now()) { gToken = o.t; gTokenExp = o.exp; try { gProfile = JSON.parse(localStorage.getItem(PROFILE_KEY)); } catch {} updateAuthUI(); return true; }
    localStorage.removeItem(TOKEN_KEY);
  } catch {}
  return false;
}
function initGoogle(){
  if (!GOOGLE_CLIENT_ID) return;
  const t = document.createElement('script');
  t.src = 'https://accounts.google.com/gsi/client'; t.async = true;
  // 팝업 차단을 피하려면 requestAccessToken 이 클릭 직후 동기 호출돼야 하므로 미리 로드·초기화
  t.onload = () => {
    gClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      include_granted_scopes: false,   // 예전에 허용한 권한(youtube.readonly ↔ drive.file)이 자동으로 합쳐져 invalid_request 나는 것 방지
      scope: 'openid email profile https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.appdata',
      callback: r => {
        if (r.error) { toast('로그인 실패: ' + r.error); return; }
        gToken = r.access_token; gTokenExp = Date.now() + (r.expires_in - 60) * 1000;
        try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ t: gToken, exp: gTokenExp })); } catch {}
        updateAuthUI(); loadProfile();
        if (google.accounts.oauth2.hasGrantedAllScopes(r, 'https://www.googleapis.com/auth/drive.file')) driveSync();
        else setSyncStatus('warn', '⚠ 드라이브 권한이 허용되지 않아 동기화가 꺼져 있습니다 (다시 로그인해서 체크)');
      }
    });
    ytClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      include_granted_scopes: false,   // 예전에 허용한 권한(youtube.readonly ↔ drive.file)이 자동으로 합쳐져 invalid_request 나는 것 방지
      scope: 'https://www.googleapis.com/auth/youtube.readonly',
      callback: r => {
        if (r.error) { toast('유튜브 권한 실패: ' + r.error); return; }
        ytToken = r.access_token; ytTokenExp = Date.now() + (r.expires_in - 60) * 1000;
        openGoogleModal();
      }
    });
  };
  document.head.appendChild(t);
}
/* ---------- 구글 드라이브 동기화 (내 드라이브의 '우리집 재생목록 (동기화).json') ----------
   drive.file 범위: 이 앱(같은 Cloud 프로젝트)이 만든 파일만 보인다. TV 앱의 기기 코드 로그인은
   drive.appdata 를 허용하지 않아서, 예전 appDataFolder/playlist.json 에서 이 파일로 옮겼다(첫 동기화 때 자동 이전).
   기기마다 '마지막으로 맞춘 상태(base)'를 기억해 두고 3-way 병합:
   양쪽이 다 바뀌었으면 로컬 기준 + 원격에서 새로 생긴 영상 추가 + 원격에서 지운 영상 삭제 */
const BASE_KEY = 'home-playlist-drive-base';
const DRIVE_FILE = '우리집 재생목록 (동기화).json';
const LEGACY_FILE = 'playlist.json';   // appDataFolder (이전용으로 읽기만)
let driveFileId = null, driveBusy = null, driveTimer = null;
function setSyncStatus(cls, text){
  const el = $('#syncStatus'); el.className = cls;
  $('#syncText').textContent = text.replace(/^[☁⚠]\s*/, '');
  $('#syncShort').textContent = cls === 'on' ? '동기화됨' : cls === 'warn' ? '동기화 문제' : loggedIn() ? '동기화 중' : '로그인 안 함';
}
const loggedIn = () => gToken && Date.now() < gTokenExp;
function scheduleDriveSync(){ if (!loggedIn()) return; clearTimeout(driveTimer); driveTimer = setTimeout(driveSync, 1500); }
async function drive(url, opt = {}){
  const r = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + gToken, ...(opt.headers || {}) } });
  if (r.status === 401) { gToken = null; localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(PROFILE_KEY); updateAuthUI(); throw new Error('로그인 만료'); }
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error?.message || r.status); }
  return r;
}
async function driveRead(){
  if (!driveFileId) {
    const q = new URLSearchParams({ q: `name='${DRIVE_FILE}' and trashed=false`, orderBy: 'modifiedTime desc', fields: 'files(id)' });
    const j = await (await drive('https://www.googleapis.com/drive/v3/files?' + q)).json();
    driveFileId = j.files?.[0]?.id || null;
  }
  if (driveFileId) return (await drive(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`)).json();
  // 새 파일이 아직 없으면 예전 위치(appDataFolder)에서 가져와 이전한다. TV 토큰엔 appdata 권한이 없어 실패 → 무시
  try {
    const q = new URLSearchParams({ spaces: 'appDataFolder', q: `name='${LEGACY_FILE}'`, fields: 'files(id)' });
    const id = (await (await drive('https://www.googleapis.com/drive/v3/files?' + q)).json()).files?.[0]?.id;
    if (id) return { ...(await (await drive(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json()), _legacy: true };
  } catch (e) { if (/만료/.test(e.message)) throw e; }
  return null;
}
async function driveWrite(data){
  const body = JSON.stringify(data);
  if (driveFileId) {
    await drive(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
  } else {
    const fd = new FormData();
    fd.append('metadata', new Blob([JSON.stringify({ name: DRIVE_FILE, mimeType: 'application/json' })], { type: 'application/json' }));
    fd.append('file', new Blob([body], { type: 'application/json' }));
    const j = await (await drive('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', body: fd })).json();
    driveFileId = j.id;
  }
}
// local/remote/base: [{id,title}] 배열. base 가 null(처음 연결)이면 합집합
function mergeLists(local, remote, base){
  const L = new Set(local.map(x => x.id)), R = new Set(remote.map(x => x.id)), B = new Set((base || []).map(x => x.id));
  const out = local.filter(x => !(B.has(x.id) && !R.has(x.id)));            // 원격에서 지운 것 제거
  for (const x of remote) if (!L.has(x.id) && !B.has(x.id)) out.push(x);    // 원격에서 새로 생긴 것 추가
  return out;
}
async function driveSync(){
  if (!loggedIn()) return;
  if (driveBusy) { scheduleDriveSync(); return; }
  driveBusy = (async () => {
    setSyncStatus('', '☁ 동기화 중…');
    try {
      let base = null; try { base = JSON.parse(localStorage.getItem(BASE_KEY)); } catch {}
      const remote = await driveRead();
      const sig = a => a.map(x => x.id).join(',');
      const local = items.map(({ id, title }) => ({ id, title }));
      const localChanged = !base || sig(local) !== sig(base.items);
      const remoteChanged = remote && (!base || remote.updatedAt !== base.updatedAt);
      let next = null, push = false;
      // 원격 파일이 없을 때 빈 목록으로 새로 만들지 않는다 — TV가 먼저 로그인해 빈 파일을 만들면
      // 다른 기기가 그걸 '원격 변경'으로 받아 기존 목록을 지워 버리기 때문
      if (!remote && !local.length) { setSyncStatus('on', `☁ ${accountText() ? accountText() + ' · ' : ''}동기화 켜짐 · 아직 저장된 목록 없음`); return; }
      if (!remote) { next = local; push = true; }
      else if (remoteChanged && !localChanged) next = remote.items;
      else if (localChanged && !remoteChanged) { next = local; push = true; }
      else if (localChanged && remoteChanged) { next = mergeLists(local, remote.items, base && base.items); push = true; }
      if (remote && remote._legacy) { push = true; next = next || remote.items; }   // 예전 위치 → 새 파일로 이전
      let updatedAt = remote ? remote.updatedAt : 0;
      if (push) { updatedAt = Date.now(); await driveWrite({ updatedAt, items: next }); }
      if (next && sig(next) !== sig(local)) {
        const old = new Map(items.map(x => [x.id, x]));
        const curId = idx >= 0 && items[idx] ? items[idx].id : null;
        items = next.map(x => ({ ...(old.get(x.id) || {}), id: x.id, title: x.title || old.get(x.id)?.title || '' }));
        idx = curId ? items.findIndex(x => x.id === curId) : -1;
        save._sig = sig(items); localStorage.setItem(KEY, JSON.stringify(items));
        rebuildOrder(); render(); fillTitles();
        toast(`드라이브와 동기화: ${items.length}개`);
        maybeAutoStart();
        if (tvOpen()) tvRender();
      }
      localStorage.setItem(BASE_KEY, JSON.stringify({ updatedAt, items: next || local }));
      setSyncStatus('on', `☁ ${accountText() ? accountText() + ' · ' : ''}동기화 켜짐 · ${new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })} 확인`);
    } catch (e) {
      console.error(e);
      setSyncStatus('warn', /만료/.test(e.message) ? '⚠ 로그인이 만료되어 동기화가 멈췄습니다 — Google 로그인을 다시 눌러주세요' : '⚠ 동기화 실패: ' + e.message);
    }
  })();
  await driveBusy; driveBusy = null;
}

/* 로그인한 계정 표시: 구글 계정 정보(userinfo) */
const PROFILE_KEY = 'home-playlist-gprofile';

async function loadProfile(){

  let p = null;

}
async function yt(path, params){
  const out = []; let pageToken = '';
  do {
    const q = new URLSearchParams({ ...params, maxResults: 50, ...(pageToken ? { pageToken } : {}) });
    const r = await fetch(`https://www.googleapis.com/youtube/v3/${path}?${q}`, { headers: { Authorization: 'Bearer ' + ytToken } });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || r.status);
    out.push(...(j.items || [])); pageToken = j.nextPageToken || '';
  } while (pageToken);
  return out;
}
async function openGoogleModal(){
  const list = $('#gList'); $('#gModal').hidden = false;
  list.innerHTML = '<div class="src"><div class="n">목록 불러오는 중…</div></div>';
  try {
    // 유튜브 채널이 없는 계정은 playlists 가 "Channel not found" 로 실패 → 좋아요만이라도 보여준다
    let pls = [], plErr = '';
    try { pls = await yt('playlists', { part: 'snippet,contentDetails,status', mine: 'true' }); }

async function importSource(src, mode){

    const fromPlaylist = async id => (await yt('playlistItems', { part: 'snippet,status', playlistId: id }))
      .filter(x => x.status?.privacyStatus !== 'private' && !/^(Deleted|Private) video$/.test(x.snippet.title))
      .map(x => ({ id: x.snippet.resourceId.videoId, title: x.snippet.title }));
    let vids, detail = '';
    if (src.kind === 'like') {
      // videos?myRating=like 는 일부 영상을 빠뜨린다는 보고가 있어 좋아요 재생목록(LL)과 합친다
      const [a, b] = await Promise.all([
        yt('videos', { part: 'snippet', myRating: 'like' }).then(r => r.map(v => ({ id: v.id, title: v.snippet.title }))).catch(e => (console.warn('myRating', e), [])),
        fromPlaylist('LL').catch(e => (console.warn('LL', e), []))
      ]);
      const seen = new Set(); vids = [...b, ...a].filter(v => !seen.has(v.id) && seen.add(v.id));
      detail = ` (API ${a.length} · 좋아요목록 ${b.length})`;
      console.log('liked: myRating', a.length, 'LL', b.length, 'merged', vids.length);
    } else {
      vids = await fromPlaylist(src.id);
    }
    // 연결된 재생목록이 있으면 다음 동기화 때 덮어써지므로 연결 해제
    if (settings.pl) { settings.pl = ''; toast('재생목록 연결을 해제했습니다'); }
    if (mode === 'replace') { items = []; idx = -1; }
    let added = 0;
    for (const v of vids) if (v.id && !items.some(x => x.id === v.id)) { items.push({ id: v.id, title: v.title }); added++; }
    save(); rebuildOrder(); render();
    $('#gModal').hidden = true;
    const dup = vids.length - added;
    toast(`${vids.length}개 받음${detail} → ${added}개 추가` + (dup ? `, ${dup}개는 이미 있음` : ''), 5000);
  } catch (e) {
    console.error(e);
    toast(/channel not found/i.test(e.message) ? '이 계정에는 유튜브 채널이 없습니다 — 채널이 있는 계정으로 로그인하세요' : '가져오기 실패: ' + e.message);
  }
}

// 폰: 손잡이(≡)를 눌러 끌면 순서 바꾸기, 행을 왼쪽으로 밀면 삭제
function attachTouch(d, i){

  // 놓일 자리는 표시선(.drop-before/.drop-after)으로, 실제 순서는 손을 뗄 때 moveItem 한 번
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); try { grip.setPointerCapture(e.pointerId); } catch {}
    const scroller = list.scrollHeight > list.clientHeight ? list : $('#side');   // 폰은 #side 가 스크롤 컨테이너
    const y0 = e.clientY, s0 = scroller.scrollTop; let to = i;

      const kids = [...list.children], sibs = kids.filter(x => x !== d);

      else if (sibs.length) { sibs[sibs.length - 1].classList.add('drop-after'); to = kids.length - 1; }

    const up = () => {
      d.removeEventListener('pointermove', move); d.removeEventListener('pointerup', up); d.removeEventListener('pointercancel', up);
      if (!swiping) return;
      d._swiped = true; setTimeout(() => { d._swiped = false; }, 300);
      if (dx < -80) { d.style.transform = 'translateX(-96px)'; askDelete(i, d, snapBack); }   // 빨간 배경을 보인 채로 확인

// 제목 옆 점: 재생 순서(order) 기준으로 본 것(초록)·지금(빨강)·남은 것(베이지). 너무 많으면 숫자로

// 진행 막대: 0.5초마다
const fmt = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;
function tickProgress(){
  if (scrubbing) return;
  let cur = 0, dur = 0;
  if (ready && idx >= 0) { try { cur = player.getCurrentTime() || 0; dur = player.getDuration() || 0; } catch {} }
  const pct = dur ? Math.min(100, cur / dur * 100) : 0;
  $('#prog .fill').style.width = pct + '%'; $('#prog .knob').style.left = pct + '%';
  $('#tCur').textContent = fmt(cur); $('#tDur').textContent = fmt(dur);
}
setInterval(tickProgress, 500);
// 막대 클릭·드래그로 이동: 끄는 동안은 손잡이만 따라가고 놓을 때 seekTo
let scrubbing = false;
{
  const track = $('#prog .track');
  const ratioAt = e => { const r = track.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  const paint = r => { let dur = 0; try { dur = player.getDuration() || 0; } catch {} $('#prog .fill').style.width = r * 100 + '%'; $('#prog .knob').style.left = r * 100 + '%'; $('#tCur').textContent = fmt(r * dur); };
  track.addEventListener('pointerdown', e => { if (!ready || idx < 0) return; scrubbing = true; try { track.setPointerCapture(e.pointerId); } catch {} paint(ratioAt(e)); e.preventDefault(); });

  track.addEventListener('pointerup', e => { if (!scrubbing) return; scrubbing = false; let dur = 0; try { dur = player.getDuration() || 0; } catch {} if (dur) { try { player.seekTo(ratioAt(e) * dur, true); } catch {} } tickProgress(); });
  track.addEventListener('pointercancel', () => { scrubbing = false; });
}
const setPlayIcon = on => $('#btnPlay').classList.toggle('playing', on);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 재생 순서 ---------- */
function rebuildOrder(){
  order = items.map((_,i)=>i).filter(i=>!items[i].bad);
  if (settings.shuffle) for (let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  orderPos = order.indexOf(idx);
}
function step(dir){
  if (!order.length) { rebuildOrder(); if (!order.length) { toast('재생할 영상이 없습니다'); return; } }
  if (orderPos < 0) orderPos = 0; else orderPos += dir;
  if (orderPos >= order.length) { if (!settings.loop) { showCover('재생목록 끝'); return; } orderPos = 0; if (settings.shuffle) rebuildOrder(); }

/* ---------- 플레이어 ---------- */
// 플레이어는 A/B 두 개. `player` = 보이는 쪽(활성), `spare` = 숨긴 쪽(대기).
// 대기 플레이어에 다음 영상을 음소거로 미리 '재생'해 앞 광고를 소진시킨 뒤 0초에 멈춰 두고, 활성 영상이 끝나면 둘을 맞바꿔
// 바로 이어 재생한다 (PRELOAD). 앱(TVAPP)에선 기본 켜짐, ?preload=1|0 으로 강제 — PC 는 보통 프리미엄 쿠키로 광고가 없어 불필요
const PRELOAD = (p => p === null ? TVAPP : p === '1')(new URLSearchParams(location.search).get('preload'));
const PLAYER_VARS = { autoplay:1, controls:0, rel:0, modestbranding:1, iv_load_policy:3, fs:0, playsinline:1, disablekb:1, cc_load_policy:0 };
let playerA = null, spare = null, spareReady = false;

let spareState = 'idle';       // idle(비어 있음) → loading(불러오는 중·광고 소진 중) → ready(본영상 0초에서 일시정지)
let mainStarted = false;       // 활성 영상이 (광고 끝나고) 실제로 시작됐는지
function makePlayer(elId, extraVars, onReady){
  return new YT.Player(elId, { width:'100%', height:'100%', playerVars: { ...PLAYER_VARS, ...extraVars }, events: { onReady, onStateChange: onPlayerState, onError: onPlayerError } });
}
function onYouTubeIframeAPIReady(){
  ytReady = true;
  if (pendingSync) { pendingSync = false; syncPlaylist(); }
  player = playerA = makePlayer('playerA', {}, () => { ready = true; if (idx>=0) playIndex(idx, true); else maybeAutoStart(); });
  if (PRELOAD) spare = makePlayer('playerB', { mute:1 }, () => { spareReady = true; if (mainStarted) preloadNext(); });
}
function onPlayerState(e){
  if (e.target !== player) { onSpareState(e); return; }
  setPlayIcon(e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING);
  if (e.data === YT.PlayerState.PAUSED && idx >= 0 && items[idx]) showCover('일시정지', items[idx].id);   // 유튜브 일시정지 화면(제목·추천) 가리기
  if (e.data === YT.PlayerState.ENDED) { showCover('다음 영상…'); setTimeout(()=>step(1), 150); }
  if (e.data === YT.PlayerState.PLAYING) { hideCover(); captionsOff(); adUnmute(); if (!mainStarted) { mainStarted = true; preloadNext(); } }
}
function onPlayerError(e){
  // 100: 없음/비공개, 101/150: 임베드 금지, 2: 잘못된 ID
  if (e.target !== player) { onSpareError(e); return; }
  if (idx>=0 && items[idx]) { items[idx].bad = true; save(); toast(`재생 불가(코드 ${e.data}) → 건너뜀`); rebuildOrder(); render(); }

function playIndex(i, viaOrder){
  if (i<0 || i>=items.length) return;

  if (!ready) return;
  showCover(items[i].title || items[i].id);
  tickProgress();
  if (spareState !== 'idle' && spareId === items[i].id) { swapToSpare(); return; }   // 미리 받아 둔 영상이면 플레이어 교대

/* ---------- 다음 영상 미리 받기 (PRELOAD) ---------- */
// 현재 순서에서 다음에 재생될 인덱스 (step(1) 과 같은 규칙, 상태는 바꾸지 않음)
function peekNext(){

function preloadNext(){

function onSpareState(e){

  const old = player; player = spare; spare = old;
  $('#wrapA').classList.toggle('standby', player !== playerA);
  $('#wrapB').classList.toggle('standby', player === playerA);
  const wasReady = spareState === 'ready';
  spareId = null; spareState = 'idle';
  try { spare.stopVideo(); } catch {}
  if (wasReady) { adMuted = false; try { player.unMute(); player.playVideo(); } catch {} }   // 광고 이미 소진 → 바로 재생
  else { adMuted = true; }                                                                   // 아직 광고 중 → 음소거 유지, 본영상 PLAYING 때 해제
}
// 자막 끄기: cc_load_policy:0 만으로는 영상·언어 설정에 따라 자동 자막이 켜지므로 재생 시작 때마다 자막 모듈을 내린다
function captionsOff(){
  try { player.unloadModule('captions'); player.unloadModule('cc'); } catch {}
  setTimeout(() => { try { player.unloadModule('captions'); } catch {} }, 1500);   // 늦게 켜지는 경우 대비
}
// 영상 시작 전 광고는 덮개(#cover) 아래에서 소리만 나온다 → 새 영상을 불러올 때 음소거하고
// 본영상이 PLAYING 이 되면 다시 켠다 (본영상 중간 광고는 감지할 방법이 없어 대상 아님)
let adMuted = false;
function adMute(){ try { if (!player.isMuted()) { player.mute(); adMuted = true; } } catch {} }
function adUnmute(){ if (adMuted) { try { player.unMute(); } catch {} adMuted = false; } }
function showCover(t, img){
  const c = $('#cover'), im = c.querySelector('img');
  c.querySelector('span').textContent = t; c.classList.toggle('paused', !!img); c.classList.remove('hidden');
  if (img) { im.onerror = () => { im.onerror = null; im.src = thumb(img); }; im.src = `https://img.youtube.com/vi/${img}/maxresdefault.jpg`; }   // 고화질 없으면 mqdefault
  else im.removeAttribute('src');
}
function hideCover(){ $('#cover').classList.add('hidden'); }
function togglePlay(){
  if (!ready) return;
  if (idx<0) { step(1); return; }
  const s = player.getPlayerState();
  s === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
}

/* ---------- 추가/도구 ---------- */
function addFromInput(){
  const raw = $('#urlInput').value;
  const pl = extractPlaylistId(raw);
  if (pl) {
    if (settings.pl !== pl && items.length && !confirm('이 재생목록을 연결할까요? 현재 목록은 재생목록 내용으로 바뀝니다.')) return;
    $('#urlInput').value = ''; linkPlaylist(pl); return;
  }
  const ids = raw.split(/[\s,]+/).map(extractId).filter(Boolean);
  if (!ids.length) { toast('유효한 유튜브 URL이 없습니다'); return; }
  let added = 0;
  for (const id of ids) if (!items.some(x=>x.id===id)) { items.push({id, title:''}); added++; }
  $('#urlInput').value = '';
  save(); rebuildOrder(); render(); fillTitles();
  toast(`${added}개 추가됨`);
  if (idx<0 && items.length) playIndex(items.length-added);
}
$('#btnAdd').onclick = addFromInput;
$('#urlInput').addEventListener('keydown', e => { if (e.key==='Enter') addFromInput(); });
$('#btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(items.map(({id,title})=>({id,title})), null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'playlist.json'; a.click();
};
$('#btnImport').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const arr = JSON.parse(await f.text()); for (const x of arr){ const id = typeof x==='string'?extractId(x):x.id; if (id && !items.some(y=>y.id===id)) items.push({id, title:x.title||''}); } save(); rebuildOrder(); render(); fillTitles(); toast('가져오기 완료'); }
  catch { toast('JSON 형식이 올바르지 않습니다'); }
  e.target.value = '';
};
$('#btnSync').onclick = syncPlaylist;
$('#btnUnlink').onclick = () => { settings.pl = ''; save(); render(); toast('연결 해제 (목록은 그대로 남습니다)'); };
$('#btnGoogle').onclick = googleClick;
$('#btnImportYt').onclick = importClick;
$('#gClose').onclick = () => $('#gModal').hidden = true;
// 삭제 확인 레이어 (폰 스와이프). ok 면 행을 밀어내며 삭제, 아니면 제자리로
function askDelete(i, d, cancel){
  const m = $('#confirm'); m.hidden = false;
  $('#confirmTitle').textContent = items[i] ? (items[i].title || items[i].id) : '';
  const close = () => { m.hidden = true; m.onclick = null; };
  $('#confirmYes').onclick = () => { close(); d.classList.remove('swiping'); d.style.transform = 'translateX(-110%)'; setTimeout(() => removeItem(i), 150); };
  $('#confirmNo').onclick = () => { close(); cancel(); };
  m.onclick = e => { if (e.target === m) { close(); cancel(); } };
}
$('#btnTools').onclick = () => { const on = document.body.classList.toggle('tools-open'); $('#btnTools').textContent = on ? '도구 닫기' : '도구 보기'; };
$('#btnClearBad').onclick = () => { items = items.filter(x=>!x.bad); idx = -1; save(); rebuildOrder(); render(); };
$('#btnClear').onclick = () => { if (confirm('재생목록을 모두 지울까요?')) { items=[]; idx=-1; save(); rebuildOrder(); render(); } };

/* ---------- 컨트롤 ---------- */
$('#btnPrev').onclick = () => step(-1);
$('#btnNext').onclick = () => step(1);
$('#btnPlay').onclick = togglePlay;
$('#btnLoop').onclick = () => { settings.loop=!settings.loop; save(); render(); preloadNext(); };
$('#btnShuffle').onclick = () => { settings.shuffle=!settings.shuffle; save(); rebuildOrder(); render(); preloadNext(); };
$('#btnReload').onclick = () => TVAPP && KidsTV.reload ? KidsTV.reload() : location.reload();
$('#btnTv').onclick = () => { settings.tv=!settings.tv; save(); render(); };
$('#btnFull').onclick = () => {
  if (TVAPP) { setFull(true); return; }   // 앱: 영상 틀만 화면 가득 (뒤로 버튼으로 해제)
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (isFull()) { setFull(false); return; }
  // PC·폰: 페이지가 아니라 영상 틀(#frame)만 전체화면. 요소 전체화면이 안 되는 브라우저(아이폰 사파리)는 CSS 로 화면 가득(body.full) + ✕
  const f = $('#frame');
  const fallback = () => { if (!document.fullscreenElement && !isFull()) setFull(true); };   // 거부되거나 응답이 없으면 CSS 전체화면
  if (f.requestFullscreen) { Promise.resolve(f.requestFullscreen()).catch(fallback); setTimeout(fallback, 800); }
  else if (f.webkitRequestFullscreen) { f.webkitRequestFullscreen(); setTimeout(fallback, 800); }
  else fallback();
};
document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) document.body.classList.remove('full'); });
$('#fsExit').onclick = () => setFull(false);
// 키 처리 (키보드 + TV 앱 리모컨 공용). 처리했으면 true
// TV 앱: ←/→ 는 하단 바 버튼 사이 이동, 가운데 버튼은 고른 버튼 누르기
let barIdx = 1;   // 시작은 ⏯
function barButtons(){ return [...document.querySelectorAll('#bar button')].filter(b => b.offsetParent !== null); }
function barMark(){
  const bs = barButtons(); barIdx = Math.max(0, Math.min(bs.length - 1, barIdx));
  bs.forEach((b, i) => b.classList.toggle('kfocus', i === barIdx));
}
// TV 앱 ←/→: 한 번 = 기존 동작(버튼 이동 / 전체화면에선 이전·다음), 빠르게 두 번 = 10초, 세 번 = 30초, 그 뒤 한 번마다 +10초.
// 두 번째 누름을 기다려야 하므로 한 번 누르기는 ARROW_WAIT 만큼 늦게 실행된다
const ARROW_WAIT = 200;
const seekTotal = n => n < 2 ? 0 : n === 2 ? 10 : 30 + 10 * (n - 3);   // n번 연속 누름 → 총 이동 초
let arrowTimer = null, arrowKey = null, arrowCount = 0, seekSum = 0, seekBase = 0;
function arrowSingle(k){
  if (isFull()) step(k === 'ArrowRight' ? 1 : -1);
  else { barIdx += k === 'ArrowRight' ? 1 : -1; barMark(); }
}
function seekByTotal(total){
  if (!ready || idx < 0) return;
  const st = player.getPlayerState();
  if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.PAUSED && st !== YT.PlayerState.BUFFERING) return;
  // seekTo 직후엔 getCurrentTime 이 아직 안 바뀌므로 연속 누름은 처음 위치 + 누적값으로 계산
  if (seekSum === 0) seekBase = player.getCurrentTime();
  seekSum = total;
  const dur = player.getDuration() || 0, t = Math.max(0, Math.min(dur - 1, seekBase + seekSum));
  player.seekTo(t, true);
  toast(`${seekSum > 0 ? '⏩ +' : '⏪ '}${seekSum}초 · ${fmt(t)} / ${fmt(dur)}`, 1200);
  tickProgress();
}
function arrowPress(k){
  if (arrowTimer && arrowKey === k) {            // 두 번째 이후 누름 → 10초 이동
    clearTimeout(arrowTimer);
    arrowCount++;
    seekByTotal((k === 'ArrowRight' ? 1 : -1) * seekTotal(arrowCount));
  } else {                                       // 첫 누름 (다른 방향이면 이전 것은 버림)
    clearTimeout(arrowTimer);
    arrowKey = k; arrowCount = 1; seekSum = 0;
  }
  arrowTimer = setTimeout(() => {
    if (arrowCount === 1) arrowSingle(arrowKey);
    arrowTimer = null; arrowKey = null; arrowCount = 0; seekSum = 0;
  }, ARROW_WAIT);
}
function handleKey(k){
  if (tvOpen()) { tvKey(k); return true; }
  if (TVAPP && (k === 'ArrowLeft' || k === 'ArrowRight')) { arrowPress(k); return true; }
  // 전체화면(하단 바 없음): ←/→ 이전·다음, 가운데 재생·정지
  if (TVAPP && isFull()) {
    if (k === 'ArrowLeft' || k === 'ArrowRight') { step(k === 'ArrowRight' ? 1 : -1); return true; }
    if (k === 'Enter' || k === ' ') { togglePlay(); return true; }
  }
  if (TVAPP && (k === 'ArrowLeft' || k === 'ArrowRight')) { barIdx += k === 'ArrowRight' ? 1 : -1; barMark(); return true; }
  if (TVAPP && (k === 'Enter' || k === ' ')) { barButtons()[barIdx]?.click(); barMark(); return true; }
  if (k === 'ArrowDown' || k === 'ArrowUp') { if (settings.tv) tvShow(); return true; }
  if (k===' '||k==='Enter'||k==='MediaPlayPause') togglePlay();
  else if (k==='ArrowRight'||k==='MediaTrackNext') step(1);
  else if (k==='ArrowLeft'||k==='MediaTrackPrevious') step(-1);
  else if (k==='l'||k==='L') $('#btnLoop').click();
  else if (k==='t'||k==='T') $('#btnTv').click();
  else if (k==='f'||k==='F') $('#btnFull').click();
  else if (k==='Escape' && isFull() && !TVAPP) setFull(false);
  else return false;
  return true;
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.target.tagName === 'BUTTON' && (e.key===' '||e.key==='Enter') && !tvOpen()) return; // 포커스된 버튼은 기본 클릭으로 처리
  if (handleKey(e.key)) e.preventDefault();
});
// TV 앱은 리모컨 키를 WebView 포커스 이동 대신 이 함수로 직접 넘긴다
window.kidsTvKey = k => handleKey(k);

/* ---------- TV 앱 연동 ---------- */
// 앱이 기기 코드 흐름으로 받은 액세스 토큰을 넘겨준다 (만료 전 자동 갱신)
window.kidsTvToken = (t, exp) => {
  const first = !loggedIn();
  gToken = t; gTokenExp = exp;
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ t, exp })); } catch {}
  updateAuthUI();
  if (first) { loadProfile(); driveSync(); }
};
// 리모컨 ↓ 로 여는 "골라 보기": 맨 위 칩 줄(처음부터 다시·새로고침·로그인) + 3×2 격자, 페이지 넘김
let tvSel = -1, tvChip = 0, tvPage = 0;   // tvSel: -1 = 칩 줄(tvChip 번째), 0~ = 영상 인덱스
const TV_PAGE = 6, TV_COLS = 3;
const tvOpen = () => !$('#tvList').hidden;
function tvChips(){
  // 셔플은 TV 에 없음(폰·PC 설정을 따름). 전체화면은 재생 화면 버튼. 새로고침은 시안에서 뺐다가 사용자 요청으로 다시 넣음
  const c = [
    { label: '처음부터 다시', on: settings.loop, keep: true, run: () => $('#btnLoop').click() },
    { label: '새로고침', title: '최신 목록·최신 버전 받기', run: () => TVAPP && KidsTV.reload ? KidsTV.reload() : location.reload() },
  ];
  if (TVAPP) c.push(loggedIn()
    ? { label: '로그아웃', img: gProfile && gProfile.picture, title: accountText(), keep: true, run: () => logout() }   // 프로필 사진 + 로그아웃, 칩은 '로그인' 으로 바뀜
    : { label: '로그인', run: () => KidsTV.login() });
  return c;
}
function runChip(k){ const c = tvChips()[k]; if (!c) return; if (c.keep) { c.run(); tvRender(); } else { tvHide(); c.run(); } }
function tvRender(){
  const chips = tvChips(), cb = $('#tvChips'); cb.innerHTML = '';
  chips.forEach((c, k) => {
    const b = document.createElement('button');
    b.className = 'chip' + (c.on ? ' on' : '') + (tvSel < 0 && k === tvChip ? ' sel' : '');
    b.innerHTML = ICON.check + (c.img ? `<img src="${esc(c.img)}" referrerpolicy="no-referrer" alt="">` : '') + `<span>${esc(c.label)}</span>`; if (c.title) b.title = c.title;
    b.onclick = () => runChip(k);
    cb.appendChild(b);
  });
  const grid = $('#tvItems'); grid.innerHTML = '';
  const pages = Math.max(1, Math.ceil(items.length / TV_PAGE));
  if (tvSel >= 0) tvPage = Math.floor(tvSel / TV_PAGE);
  tvPage = Math.min(tvPage, pages - 1);
  items.slice(tvPage * TV_PAGE, (tvPage + 1) * TV_PAGE).forEach((it, k) => {
    const i = tvPage * TV_PAGE + k, d = document.createElement('div');
    d.className = 'tvi' + (i === tvSel ? ' sel' : '') + (i === idx ? ' cur' : '') + (it.bad ? ' bad' : '');
    d.innerHTML = `<div class="th"><img src="${thumb(it.id)}" alt=""><b class="n">${i + 1}</b></div><span>${esc(it.title || it.id)}</span>`;
    d.onclick = () => { tvHide(); playIndex(i); };
    grid.appendChild(d);
  });
  if (!items.length) grid.innerHTML = '<div class="tvEmpty">목록이 비어 있습니다 — 휴대폰에서 영상을 추가하세요</div>';
  const pg = $('#tvPages'); pg.innerHTML = '';
  if (pages > 1) for (let p = 0; p < pages; p++) { const i = document.createElement('i'); if (p === tvPage) i.className = 'now'; pg.appendChild(i); }
}
function tvShow(){ tvSel = idx >= 0 ? idx : (items.length ? 0 : -1); tvChip = 0; $('#tvList').hidden = false; tvRender(); }
function tvHide(){ $('#tvList').hidden = true; }
function tvKey(k){
  const n = items.length, C = tvChips().length;
  const row = i => Math.floor(i / TV_COLS);
  if (k === 'ArrowDown') {
    if (tvSel < 0) tvSel = n ? tvPage * TV_PAGE : -1;              // 칩 줄 → 이 페이지 첫 줄
    else if (tvSel + TV_COLS < n) tvSel += TV_COLS;                 // 다음 줄 (마지막 줄이면 다음 페이지)
    else if (row(tvSel) < row(n - 1)) tvSel = n - 1;                // 아래 줄이 짧으면 마지막 영상
    else tvSel = -1;                                                // 끝 → 칩 줄로 순환
  } else if (k === 'ArrowUp') {
    if (tvSel < 0) tvSel = n - 1;                                   // 칩 줄에서 ↑ → 마지막 영상으로 순환
    else if (tvSel - TV_COLS >= 0) tvSel -= TV_COLS;
    else tvSel = -1;                                                // 첫 줄에서 ↑ → 칩 줄
  } else if (k === 'ArrowLeft' || k === 'ArrowRight') {
    const dir = k === 'ArrowRight' ? 1 : -1;
    if (tvSel < 0) tvChip = (tvChip + dir + C) % C;
    else if (n) tvSel = (tvSel + dir + n) % n;
  } else if (k === 'Enter' || k === ' ') {
    if (tvSel < 0) runChip(tvChip); else { tvHide(); playIndex(tvSel); }
    return;
  }
  else if (k === 'Escape' || k === 'Backspace' || k === 'GoBack') { tvHide(); return; }
  else return;
  tvRender();
}
function setFull(on){ document.body.classList.toggle('full', on); if (!on) barMark(); toast(on ? (TVAPP ? '전체화면 — 뒤로 버튼으로 해제' : '전체화면 — ✕ 또는 Esc 로 해제') : '전체화면 해제', 1500); }
const isFull = () => document.body.classList.contains('full');
// 뒤로: 목록 닫기 → 전체화면 해제 → (앱이) "한 번 더 누르면 종료"
window.kidsTvBack = () => { if (tvOpen()) { tvHide(); return true; } if (isFull()) { setFull(false); return true; } return false; };
// 앱에서는 켜자마자 재생
function maybeAutoStart(){
  if (!TVAPP || !ready || idx >= 0 || !items.some(x => !x.bad)) return;
  const i = items.findIndex(x => x.id === settings.last && !x.bad);   // 마지막으로 보던 영상부터
  i >= 0 ? playIndex(i) : step(1);
}

/* ---------- ?add= : 유튜브 앱 공유(아이폰 단축어)·PC 북마클릿에서 넘어온 영상 추가 ---------- */
// 이미 열려 있는 탭이 있으면 그 탭에 넘기고(BroadcastChannel) 이 탭은 닫는다 — 오래된 목록으로 덮어쓰는 것 방지
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('kids-playlist') : null;
function addIds(ids){
  let added = 0;
  for (const id of ids) if (!items.some(x => x.id === id)) { items.push({ id, title: '' }); added++; }
  if (added) { save(); rebuildOrder(); render(); fillTitles(); }
  return added;
}
const addMsg = (n, total) => n ? `${n}개 추가됨` : (total ? '이미 목록에 있는 영상입니다' : '유효한 유튜브 주소가 없습니다');
if (bc) bc.onmessage = e => {
  if (e.data?.type !== 'add') return;
  const n = addIds(e.data.ids);
  bc.postMessage({ type: 'ack', nonce: e.data.nonce, n });
  toast('다른 탭에서 ' + addMsg(n, e.data.ids.length), 3000);
};
function handleAddParam(raw){
  history.replaceState(null, '', location.pathname + location.search.replace(/[?&]add=[^&]*/, '').replace(/^&/, '?'));
  const ids = [...new Set(raw.split(/[\s,]+/).map(extractId).filter(Boolean))];
  const local = () => {
    const n = addIds(ids);
    toast(addMsg(n, ids.length) + (n && !loggedIn() ? ' — Google 로그인을 누르면 다른 기기와 동기화됩니다' : ''), 4000);
  };
  if (!bc || !ids.length) { local(); return; }
  const nonce = Math.random().toString(36).slice(2);
  let acked = false;
  bc.addEventListener('message', e => {
    if (e.data?.type !== 'ack' || e.data.nonce !== nonce || acked) return;
    acked = true;
    showCover('열려 있는 재생목록 탭에 ' + addMsg(e.data.n, ids.length) + ' — 이 탭은 닫아도 됩니다');
    window.close();                                   // 스크립트로 연 탭이면 닫힘
    setTimeout(() => location.replace(location.pathname), 1500);  // 안 닫히면 최신 목록으로 새로고침
  });
  bc.postMessage({ type: 'add', ids, nonce });
  setTimeout(() => { if (!acked) local(); }, 700);
}

/* ---------- 시작 ---------- */
load();
settings.shuffle = false;   // 셔플 버튼을 없앴으므로 예전에 켜 둔 설정도 끈다
save._sig = items.map(x => x.id).join(',');
const hadToken = restoreToken();
const remote = new URLSearchParams(location.search).get('list');
const plParam = new URLSearchParams(location.search).get('pl');
if (plParam) settings.pl = extractPlaylistId(plParam) || plParam;
if (remote) loadRemote(remote); else if (settings.pl) syncPlaylist(); else fillTitles();
if (new URLSearchParams(location.search).get('tv')==='1' || TVAPP) settings.tv = true;
if (TVAPP) document.body.classList.add('app');
if (TVAPP) setTimeout(barMark, 0);
rebuildOrder(); render();
initGoogle();
if (hadToken) driveSync();
const addParam = new URLSearchParams(location.search).get('add');
if (addParam) handleAddParam(addParam);
const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
</script>
