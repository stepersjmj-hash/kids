<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리집 재생목록</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --sub:#9aa3b5; --accent:#ff5c5c; --ok:#3ddc84; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  body { display:grid; grid-template-columns: 1fr 360px; grid-template-rows:100vh; }
  body.tv { grid-template-columns: 1fr; }
  body.tv #side { display:none; }
  #stage { position:relative; background:#000; display:flex; flex-direction:column; }
  #player-wrap { position:relative; flex:1; }
  #player { position:absolute; inset:0; width:100%; height:100%; }
  /* 끝화면/추천 가리기용 덮개: 재생 중엔 투명, 전환 중엔 불투명 */
  #cover { position:absolute; inset:0; background:#000; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:20px; transition:opacity .25s; pointer-events:none; }
  #cover.hidden { opacity:0; }
  #bar { display:flex; gap:8px; align-items:center; padding:10px 12px; background:var(--panel); border-top:1px solid var(--line); }
  #bar .title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:15px; }
  button { background:#242938; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; }
  button:hover { background:#2d3346; }
  button.on { border-color:var(--ok); color:var(--ok); }
  button.danger { color:var(--accent); }
  #side { background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #side header { padding:14px 14px 10px; border-bottom:1px solid var(--line); }
  #side h1 { font-size:17px; margin:0 0 10px; }
  #add { display:flex; gap:6px; }
  #add input { flex:1; background:#0f1115; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font-size:14px; }
  #tools { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  #tools button { padding:6px 9px; font-size:12px; }
  #list { flex:1; overflow:auto; padding:8px; }
  .item { display:grid; grid-template-columns:72px 1fr auto; gap:8px; align-items:center; padding:6px; border-radius:10px; cursor:pointer; border:1px solid transparent; }
  .item:hover { background:#1f2430; }
  .item.current { border-color:var(--ok); background:#1a2a22; }
  .item.bad { opacity:.5; }
  .item img { width:72px; height:40px; object-fit:cover; border-radius:6px; background:#000; }
  .item .t { font-size:13px; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .item .t small { display:block; color:var(--sub); font-size:11px; margin-top:2px; }
  .item .ops { display:flex; flex-direction:column; gap:3px; }
  .item .ops button { padding:2px 6px; font-size:11px; line-height:1.4; }
  #hint { padding:8px 14px 12px; color:var(--sub); font-size:12px; line-height:1.5; border-top:1px solid var(--line); }
  #toast { position:fixed; left:50%; bottom:70px; transform:translateX(-50%); background:#242938; border:1px solid var(--line); padding:8px 14px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  @media (max-width: 820px) {
    body { grid-template-columns:1fr; grid-template-rows: 56vh 44vh; }
    #side { border-left:none; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="player-wrap">
    <div id="player"></div>
    <div id="cover">재생목록에서 영상을 선택하세요</div>
  </div>
  <div id="bar">
    <button id="btnPrev" title="이전 (←)">⏮</button>
    <button id="btnPlay" title="재생/일시정지 (Space)">⏯</button>
    <button id="btnNext" title="다음 (→)">⏭</button>
    <div class="title" id="nowTitle">—</div>
    <button id="btnLoop" class="on" title="반복 (L)">🔁 반복</button>
    <button id="btnShuffle" title="셔플 (S)">🔀 셔플</button>
    <button id="btnTv" title="TV 모드: 목록 숨김 (T)">📺 TV</button>
    <button id="btnFull" title="전체화면 (F)">⛶</button>
  </div>
</div>

<aside id="side">
  <header>
    <h1>우리집 재생목록</h1>
    <div id="add">
      <input id="urlInput" placeholder="유튜브 URL 또는 영상 ID 붙여넣기 (여러 개는 줄바꿈/공백 구분)">
      <button id="btnAdd">추가</button>
    </div>
    <div id="tools">
      <button id="btnExport">JSON 내보내기</button>
      <button id="btnImport">JSON 가져오기</button>
      <button id="btnClearBad">재생불가 삭제</button>
      <button id="btnClear" class="danger">전체 삭제</button>
      <input type="file" id="fileInput" accept="application/json" hidden>
    </div>
  </header>
  <div id="list"></div>
  <div id="hint">
    키보드: Space 재생/정지 · ←/→ 이전/다음 · L 반복 · S 셔플 · T TV모드 · F 전체화면<br>
    원격 목록: <code>?list=JSON주소</code> 를 붙이면 그 파일을 읽어 옵니다 (GitHub raw 등).
  </div>
</aside>

<div id="toast"></div>

<script>
/* ---------- 상태 ---------- */
const KEY = 'home-playlist-v1';
const SETTINGS_KEY = 'home-playlist-settings-v1';
let items = [];               // [{id, title, bad}]
let idx = -1;                 // 현재 인덱스
let settings = { loop:true, shuffle:false, tv:false };
let player = null, ready = false;
let order = [];               // 셔플 순서(인덱스 배열)
let orderPos = -1;

const $ = s => document.querySelector(s);
const toast = (m) => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); };

/* ---------- 저장/불러오기 ---------- */
function save(){ localStorage.setItem(KEY, JSON.stringify(items)); localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
function load(){
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch { items = []; }
  try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}); } catch {}
}
async function loadRemote(url){
  try {
    const r = await fetch(url, {cache:'no-store'});
    const data = await r.json();
    const arr = Array.isArray(data) ? data : (data.items || []);
    items = arr.map(x => typeof x === 'string' ? {id:extractId(x), title:''} : {id:x.id||extractId(x.url||''), title:x.title||''}).filter(x=>x.id);
    save(); rebuildOrder(); render(); toast(`원격 목록 ${items.length}개 불러옴`);
    fillTitles();
  } catch(e){ toast('원격 목록을 읽지 못했습니다'); console.error(e); }
}

/* ---------- URL → ID ---------- */
function extractId(s){
  s = (s||'').trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:v=|\/shorts\/|youtu\.be\/|\/embed\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}

/* ---------- 제목 가져오기 (oEmbed) ---------- */
async function fetchTitle(id){
  try {
    const r = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
    if (!r.ok) throw 0;
    const j = await r.json(); return j.title || id;
  } catch { return id; }
}
async function fillTitles(){
  for (const it of items) if (!it.title) { it.title = await fetchTitle(it.id); render(); }
  save();
}

/* ---------- 목록 렌더 ---------- */
function render(){
  const el = $('#list'); el.innerHTML = '';
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'item' + (i===idx?' current':'') + (it.bad?' bad':'');
    d.innerHTML = `
      <img src="https://img.youtube.com/vi/${it.id}/mqdefault.jpg" alt="">
      <div class="t">${esc(it.title||it.id)}<small>${it.bad ? '⚠ 재생 불가 (임베드 제한)' : it.id}</small></div>
      <div class="ops">
        <button data-op="up" title="위로">▲</button>
        <button data-op="down" title="아래로">▼</button>
        <button data-op="del" title="삭제">✕</button>
      </div>`;
    d.addEventListener('click', e => {
      const op = e.target.dataset.op;
      if (op === 'del') { items.splice(i,1); if (idx===i) idx=-1; else if (idx>i) idx--; save(); rebuildOrder(); render(); return; }
      if (op === 'up' && i>0) { [items[i-1],items[i]]=[items[i],items[i-1]]; if(idx===i)idx--; else if(idx===i-1)idx++; save(); rebuildOrder(); render(); return; }
      if (op === 'down' && i<items.length-1) { [items[i+1],items[i]]=[items[i],items[i+1]]; if(idx===i)idx++; else if(idx===i+1)idx--; save(); rebuildOrder(); render(); return; }
      if (op) return;
      playIndex(i);
    });
    el.appendChild(d);
  });
  $('#nowTitle').textContent = idx>=0 && items[idx] ? (items[idx].title||items[idx].id) : '—';
  $('#btnLoop').classList.toggle('on', settings.loop);
  $('#btnShuffle').classList.toggle('on', settings.shuffle);
  $('#btnTv').classList.toggle('on', settings.tv);
  document.body.classList.toggle('tv', settings.tv);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 재생 순서 ---------- */
function rebuildOrder(){
  order = items.map((_,i)=>i).filter(i=>!items[i].bad);
  if (settings.shuffle) for (let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  orderPos = order.indexOf(idx);
}
function step(dir){
  if (!order.length) { rebuildOrder(); if (!order.length) { toast('재생할 영상이 없습니다'); return; } }
  if (orderPos < 0) orderPos = 0; else orderPos += dir;
  if (orderPos >= order.length) { if (!settings.loop) { showCover('재생목록 끝'); return; } orderPos = 0; if (settings.shuffle) rebuildOrder(); }
  if (orderPos < 0) orderPos = order.length-1;
  playIndex(order[orderPos], true);
}

/* ---------- 플레이어 ---------- */
function onYouTubeIframeAPIReady(){
  player = new YT.Player('player', {
    width:'100%', height:'100%',
    playerVars: { autoplay:1, controls:1, rel:0, modestbranding:1, iv_load_policy:3, fs:0, playsinline:1, disablekb:1 },
    events: {
      onReady: () => { ready = true; if (idx>=0) playIndex(idx, true); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) { showCover('다음 영상…'); setTimeout(()=>step(1), 150); }
        if (e.data === YT.PlayerState.PLAYING) hideCover();
      },
      onError: e => {
        // 100: 없음/비공개, 101/150: 임베드 금지, 2: 잘못된 ID
        if (idx>=0 && items[idx]) { items[idx].bad = true; save(); toast(`재생 불가(코드 ${e.data}) → 건너뜀`); rebuildOrder(); render(); }
        setTimeout(()=>step(1), 300);
      }
    }
  });
}
function playIndex(i, viaOrder){
  if (i<0 || i>=items.length) return;
  idx = i;
  if (!viaOrder) { if (items[i].bad) { items[i].bad = false; } rebuildOrder(); }
  render();
  if (!ready) return;
  showCover(items[i].title || items[i].id);
  player.loadVideoById(items[i].id);
}
function showCover(t){ const c=$('#cover'); c.textContent=t; c.classList.remove('hidden'); }
function hideCover(){ $('#cover').classList.add('hidden'); }
function togglePlay(){
  if (!ready) return;
  if (idx<0) { step(1); return; }
  const s = player.getPlayerState();
  s === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
}

/* ---------- 추가/도구 ---------- */
function addFromInput(){
  const raw = $('#urlInput').value;
  const ids = raw.split(/[\s,]+/).map(extractId).filter(Boolean);
  if (!ids.length) { toast('유효한 유튜브 URL이 없습니다'); return; }
  let added = 0;
  for (const id of ids) if (!items.some(x=>x.id===id)) { items.push({id, title:''}); added++; }
  $('#urlInput').value = '';
  save(); rebuildOrder(); render(); fillTitles();
  toast(`${added}개 추가됨`);
  if (idx<0 && items.length) playIndex(items.length-added);
}
$('#btnAdd').onclick = addFromInput;
$('#urlInput').addEventListener('keydown', e => { if (e.key==='Enter') addFromInput(); });
$('#btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(items.map(({id,title})=>({id,title})), null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'playlist.json'; a.click();
};
$('#btnImport').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const arr = JSON.parse(await f.text()); for (const x of arr){ const id = typeof x==='string'?extractId(x):x.id; if (id && !items.some(y=>y.id===id)) items.push({id, title:x.title||''}); } save(); rebuildOrder(); render(); fillTitles(); toast('가져오기 완료'); }
  catch { toast('JSON 형식이 올바르지 않습니다'); }
  e.target.value = '';
};
$('#btnClearBad').onclick = () => { items = items.filter(x=>!x.bad); idx = -1; save(); rebuildOrder(); render(); };
$('#btnClear').onclick = () => { if (confirm('재생목록을 모두 지울까요?')) { items=[]; idx=-1; save(); rebuildOrder(); render(); } };

/* ---------- 컨트롤 ---------- */
$('#btnPrev').onclick = () => step(-1);
$('#btnNext').onclick = () => step(1);
$('#btnPlay').onclick = togglePlay;
$('#btnLoop').onclick = () => { settings.loop=!settings.loop; save(); render(); };
$('#btnShuffle').onclick = () => { settings.shuffle=!settings.shuffle; save(); rebuildOrder(); render(); };
$('#btnTv').onclick = () => { settings.tv=!settings.tv; save(); render(); };
$('#btnFull').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (e.target.tagName === 'BUTTON' && (k===' '||k==='Enter')) return; // 포커스된 버튼은 기본 클릭으로 처리
  if (k===' '||k==='Enter'||k==='MediaPlayPause') { e.preventDefault(); togglePlay(); }
  else if (k==='ArrowRight'||k==='MediaTrackNext') step(1);
  else if (k==='ArrowLeft'||k==='MediaTrackPrevious') step(-1);
  else if (k==='l'||k==='L') $('#btnLoop').click();
  else if (k==='s'||k==='S') $('#btnShuffle').click();
  else if (k==='t'||k==='T') $('#btnTv').click();
  else if (k==='f'||k==='F') $('#btnFull').click();
});

/* ---------- 시작 ---------- */
load();
const remote = new URLSearchParams(location.search).get('list');
if (remote) loadRemote(remote); else fillTitles();
if (new URLSearchParams(location.search).get('tv')==='1') settings.tv = true;
rebuildOrder(); render();
const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
</script>
</body>
</html>
